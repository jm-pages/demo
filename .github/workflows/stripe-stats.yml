name: Update Stripe funding stats

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:         # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: stripe-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch totals from Stripe
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
        run: node scripts/stripe-stats.mjs

      - name: Commit stats.json if it changed
        run: |
          if git diff --quiet -- stats.json; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stats.json
            git commit -m "Update funding stats"
            git push
          fi
